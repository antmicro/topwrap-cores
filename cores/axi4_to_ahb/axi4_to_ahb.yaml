id:
  library: topwrap-cores
  name: axi4_to_ahb
  vendor: antmicro.com
interfaces:
  ahb:
    mode: manager
    signals:
      in:
        HRDATA:
          bound:
          - '63'
          - '0'
          name: ahb_hrdata
        HRESP:
          name: ahb_hresp
      out:
        HADDR:
          bound:
          - '31'
          - '0'
          name: ahb_haddr
        HBURST:
          bound:
          - '2'
          - '0'
          name: ahb_hburst
        HMASTLOCK:
          name: ahb_hmastlock
        HPROT:
          bound:
          - '3'
          - '0'
          name: ahb_hprot
        HSIZE:
          bound:
          - '2'
          - '0'
          name: ahb_hsize
        HTRANS:
          bound:
          - '1'
          - '0'
          name: ahb_htrans
        HWDATA:
          bound:
          - '63'
          - '0'
          name: ahb_hwdata
        HWRITE:
          name: ahb_hwrite
    type:
      library: topwrap-interfaces
      name: AHBguin
      vendor: antmicro.com
      version: '1.0'
    clock: bridge
    reset: bridge
  axi:
    mode: subordinate
    signals:
      in:
        araddr:
          bound:
          - '31'
          - '0'
          name: axi_araddr
        arid:
          bound:
          - TAG-1
          - '0'
          name: axi_arid
        arprot:
          bound:
          - '2'
          - '0'
          name: axi_arprot
        arsize:
          bound:
          - '2'
          - '0'
          name: axi_arsize
        arvalid:
          name: axi_arvalid
        awaddr:
          bound:
          - '31'
          - '0'
          name: axi_awaddr
        awid:
          bound:
          - TAG-1
          - '0'
          name: axi_awid
        awprot:
          bound:
          - '2'
          - '0'
          name: axi_awprot
        awsize:
          bound:
          - '2'
          - '0'
          name: axi_awsize
        awvalid:
          name: axi_awvalid
        bready:
          name: axi_bready
        rready:
          name: axi_rready
        wdata:
          bound:
          - '63'
          - '0'
          name: axi_wdata
        wlast:
          name: axi_wlast
        wstrb:
          bound:
          - '7'
          - '0'
          name: axi_wstrb
        wvalid:
          name: axi_wvalid
      out:
        arready:
          name: axi_arready
        awready:
          name: axi_awready
        bid:
          bound:
          - TAG-1
          - '0'
          name: axi_bid
        bresp:
          bound:
          - '1'
          - '0'
          name: axi_bresp
        bvalid:
          name: axi_bvalid
        rdata:
          bound:
          - '63'
          - '0'
          name: axi_rdata
        rid:
          bound:
          - TAG-1
          - '0'
          name: axi_rid
        rlast:
          name: axi_rlast
        rresp:
          bound:
          - '1'
          - '0'
          name: axi_rresp
        rvalid:
          name: axi_rvalid
        wready:
          name: axi_wready
    type:
      library: topwrap-interfaces
      name: axi4
      vendor: antmicro.com
      version: '0.1'
    clock: bridge
    reset: bridge
    size: 4096
parameters:
  ID: '1'
  PRTY: '1'
  TAG: '1'
signals:
  in:
  - name: free_clk
  - name: clk
  - name: dec_tlu_force_halt
    default: 0
  - name: scan_mode
    default: 0
  - name: ahb_hready
    default: 1
  - name: clk_override
    default: 0
  - name: bus_clk_en
    default: 1
  - name: rst_l
clocks:
  bridge:
    signal: clk
  free_clk:
    signal: free_clk
resets:
  bridge:
    signal: rst_l
    polarity: active low
